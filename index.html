<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Fénix</title>
<link rel="stylesheet" href="style.css?v=20260920">
</head>
<body>
<main class="app">
<header class="topbar">
  <div class="brand"><span class="orb"></span><div><strong>FÉNIX</strong><small>cognitive core · 0.1.0</small></div></div>
  <span id="status" class="status">iniciando</span>
</header>
<section id="chat" class="chat" aria-live="polite">
  <div class="welcome"><div class="phoenix">✦</div><h1>Fénix está despierto.</h1><p>Una IA experimental con memoria persistente y contexto propio.</p></div>
</section>
<form id="composer" class="composer" autocomplete="off">
  <textarea id="input" rows="1" maxlength="4000" placeholder="Escribe algo a Fénix..." autocomplete="off" autocorrect="on" autocapitalize="sentences" spellcheck="true"></textarea>
  <button id="send" type="submit" aria-label="Enviar">↑</button>
</form>
<footer>Memoria privada por usuario · Supabase · Fénix v0.1.0</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<script src="app.js?v=20260920"></script>
</body>
</html>
